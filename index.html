<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARROWOW • Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #050505; color: #e5e7eb; }
        .glass { background: rgba(10, 15, 30, 0.95); backdrop-filter: blur(32px); border: 1px solid rgba(103, 232, 249, 0.15); }
        .section-header { font-size: 1.4rem; letter-spacing: -.03em; }
    </style>
</head>
<body class="min-h-screen pb-24">
    <div class="max-w-screen-2xl mx-auto px-8 pt-8">
        <!-- HEADER -->
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-x-5">
                <div class="w-16 h-16 bg-gradient-to-br from-[#052659] via-[#1e3a8a] to-[#67e8f9] rounded-3xl flex items-center justify-center text-4xl font-black text-white shadow-2xl">A</div>
                <div>
                    <h1 class="text-6xl font-bold tracking-tighter text-white">ARROWOW</h1>
                    <p class="text-[#67e8f9] text-2xl -mt-3">ANALYTICS</p>
                </div>
            </div>
            <div id="last-updated" class="text-emerald-400 font-medium flex items-center gap-2"></div>
        </div>

        <!-- KPIs -->
        <div id="kpi-row" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12"></div>

        <!-- CHARACTERS -->
        <div class="mb-12">
            <div class="flex items-center justify-between mb-6">
                <h2 class="section-header font-semibold">Characters</h2>
                
                <!-- Sort Controls -->
                <div class="flex items-center gap-3">
                    <span class="text-sm text-slate-400">Sort by:</span>
                    <select id="char-sort" onchange="sortCharacters()" class="bg-slate-900 border border-slate-700 rounded-2xl px-4 py-2 text-sm">
                        <option value="engagement">Engagements (High → Low)</option>
                        <option value="views">Views (High → Low)</option>
                        <option value="followers">Followers (High → Low)</option>
                        <option value="rate">Engagement Rate (High → Low)</option>
                    </select>
                </div>
            </div>
            <div id="character-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- CHARTS -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8 mb-12">
            <div class="xl:col-span-7 glass rounded-3xl p-8">
                <h3 class="font-semibold text-xl mb-6">Monthly Views Trend</h3>
                <canvas id="viewsChart" class="h-80"></canvas>
            </div>
            <div class="xl:col-span-5 glass rounded-3xl p-8">
                <h3 class="font-semibold text-xl mb-6">Platform Distribution</h3>
                <canvas id="platformChart" class="h-80"></canvas>
            </div>
        </div>

        <!-- MONTHLY DATA TABLE -->
        <div class="glass rounded-3xl p-8">
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-semibold text-xl">Monthly Performance Data</h3>
                <div class="flex items-center gap-3">
                    <select id="month-filter" onchange="renderMonthlyTable()" class="bg-slate-900 border border-slate-700 rounded-2xl px-4 py-2 text-sm">
                        <option value="all">All Characters</option>
                    </select>
                </div>
            </div>
            <div id="monthly-table" class="overflow-x-auto"></div>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"; // ← Paste your URL

        let currentCharacters = [];

        async function loadData() {
            try {
                const res = await fetch(API_URL);https://script.google.com/macros/s/AKfycbxlARVPprS1ezTNRJ2Go8z3RR7m8AoOBSDlaXxIFIAnh7sj4AK4hHM74BIZkZQugxOf/exec
                const data = await res.json();
                currentCharacters = Object.values(data);
                initDashboard();
            } catch(e) {
                console.error(e);
                alert("Could not load live data. Using demo.");
                currentCharacters = [ /* demo data fallback */ ];
                initDashboard();
            }
        }

        function initDashboard() {
            renderKPIs();
            renderCharacterCards(currentCharacters);
            renderCharts();
            renderMonthlyTable();
            document.getElementById('last-updated').innerHTML = `✅ Live • Updated just now`;
        }

        function renderKPIs() {
            let tv = 0, tf = 0, te = 0;
            currentCharacters.forEach(c => {
                tv += c.total_views.reduce((a,b)=>a+b,0);
                tf += Math.max(...c.total_followers);
                te += c.total_engagements.reduce((a,b)=>a+b,0);
            });
            const rate = ((te / tv) * 100).toFixed(1);

            document.getElementById('kpi-row').innerHTML = `
                <div class="glass rounded-3xl p-7"><div class="text-slate-400 text-sm">TOTAL VIEWS</div><div class="text-5xl font-semibold mt-2">${tv.toLocaleString()}</div></div>
                <div class="glass rounded-3xl p-7"><div class="text-slate-400 text-sm">TOTAL FOLLOWERS</div><div class="text-5xl font-semibold mt-2">${tf.toLocaleString()}</div></div>
                <div class="glass rounded-3xl p-7"><div class="text-slate-400 text-sm">TOTAL ENGAGEMENT</div><div class="text-5xl font-semibold mt-2">${te.toLocaleString()}</div></div>
                <div class="glass rounded-3xl p-7"><div class="text-slate-400 text-sm">AVG ENG. RATE</div><div class="text-5xl font-semibold mt-2">${rate}<span class="text-3xl">%</span></div></div>
            `;
        }

        function renderCharacterCards(chars) {
            const container = document.getElementById('character-grid');
            container.innerHTML = '';

            chars.forEach(char => {
                const totalV = char.total_views.reduce((a,b)=>a+b,0);
                const totalE = char.total_engagements.reduce((a,b)=>a+b,0);
                const latestF = Math.max(...char.total_followers);
                const rate = ((totalE / totalV) * 100).toFixed(1);

                const card = document.createElement('div');
                card.className = `glass rounded-3xl p-7 border border-transparent hover:border-[#67e8f9] transition-all`;
                card.innerHTML = `
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 bg-gradient-to-br from-[#052659] to-[#67e8f9] rounded-2xl flex items-center justify-center text-white text-2xl font-bold">${char.name[0]}</div>
                        <div class="font-semibold text-xl">${char.name}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-y-3 text-sm">
                        <div><span class="text-slate-400">Views</span><br><span class="font-semibold text-lg">${totalV.toLocaleString()}</span></div>
                        <div><span class="text-slate-400">Followers</span><br><span class="font-semibold text-lg">${latestF}</span></div>
                        <div><span class="text-slate-400">Engagements</span><br><span class="font-semibold text-lg">${totalE.toLocaleString()}</span></div>
                        <div><span class="text-slate-400">Eng. Rate</span><br><span class="font-semibold text-lg">${rate}%</span></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function sortCharacters() {
            const sortBy = document.getElementById('char-sort').value;
            let sorted = [...currentCharacters];

            if (sortBy === 'engagement') {
                sorted.sort((a,b) => b.total_engagements.reduce((x,y)=>x+y,0) - a.total_engagements.reduce((x,y)=>x+y,0));
            } else if (sortBy === 'views') {
                sorted.sort((a,b) => b.total_views.reduce((x,y)=>x+y,0) - a.total_views.reduce((x,y)=>x+y,0));
            } else if (sortBy === 'followers') {
                sorted.sort((a,b) => Math.max(...b.total_followers) - Math.max(...a.total_followers));
            } else if (sortBy === 'rate') {
                sorted.sort((a,b) => {
                    const rateA = a.total_engagements.reduce((x,y)=>x+y,0) / a.total_views.reduce((x,y)=>x+y,0);
                    const rateB = b.total_engagements.reduce((x,y)=>x+y,0) / b.total_views.reduce((x,y)=>x+y,0);
                    return rateB - rateA;
                });
            }
            renderCharacterCards(sorted);
        }

        function renderCharts() {
            new Chart(document.getElementById('viewsChart'), {
                type: 'line',
                data: {
                    labels: currentCharacters[0].months,
                    datasets: currentCharacters.map((c, i) => ({
                        label: c.name,
                        data: c.total_views,
                        borderColor: ['#67e8f9', '#a855f7', '#14b8a6'][i % 3],
                        tension: 0.35,
                        borderWidth: 3.5
                    }))
                }
            });

            new Chart(document.getElementById('platformChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Instagram', 'TikTok', 'YouTube', 'Facebook'],
                    datasets: [{ data: [8500, 6600, 5400, 4500], backgroundColor: ['#67e8f9', '#a855f7', '#14b8a6', '#f59e0b'] }]
                }
            });
        }

        function renderMonthlyTable() {
            const container = document.getElementById('monthly-table');
            const filter = document.getElementById('month-filter').value;

            let html = `<table class="w-full text-sm"><thead><tr class="border-b border-slate-700 text-slate-400">
                <th class="text-left py-4">Month</th><th class="text-right py-4">Views</th><th class="text-right py-4">Followers</th>
                <th class="text-right py-4">Engagements</th><th class="text-right py-4">Eng. Rate</th></tr></thead><tbody>`;

            currentCharacters.forEach(char => {
                if (filter !== 'all' && filter !== char.name) return;

                char.months.forEach((month, i) => {
                    const v = char.total_views[i];
                    const f = char.total_followers[i];
                    const e = char.total_engagements[i];
                    const rate = v > 0 ? ((e / v) * 100).toFixed(1) : 0;
                    html += `<tr class="border-b border-slate-800">
                        <td class="py-4 font-medium">${month}</td>
                        <td class="text-right">${v.toLocaleString()}</td>
                        <td class="text-right">${f}</td>
                        <td class="text-right">${e.toLocaleString()}</td>
                        <td class="text-right font-medium text-emerald-400">${rate}%</td>
                    </tr>`;
                });
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Init
        window.onload = loadData;
    </script>
</body>
</html>
