<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARROWOW • Analytics</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; background: #021024; color: #F8FAFC; }
        .glass { background: rgba(15, 23, 42, 0.85); border: 1px solid #2A2F3A; backdrop-filter: blur(20px); }
        .section-header { font-size: 1rem; font-weight: 600; color: #C1EBFF; }
        .character-card { transition: all 0.2s ease; }
        .character-card:hover { transform: translateY(-6px); border-color: #67E8F9; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div class="max-w-screen-2xl mx-auto px-8 pt-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-x-4">
                <img src="logo.png" alt="Arrowow Logo" class="w-11 h-11 object-contain">
                <div>
                    <h1 class="text-4xl font-semibold tracking-tight">ARROWOW</h1>
                    <p class="text-[#9EEBFF] text-sm -mt-1 tracking-wide">ANALYTICS</p>
                </div>
            </div>
            <div id="last-updated" class="text-emerald-400 text-sm font-medium"></div>
        </div>

        <!-- KPIs -->
        <div class="mb-10">
            <div class="section-header mb-4">OVERVIEW</div>
            <div id="kpi-row" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>
        </div>

        <!-- Characters -->
        <div class="mb-10">
            <div class="flex justify-between items-center mb-4">
                <div class="section-header">CHARACTERS</div>
                <select id="char-sort" onchange="sortAndRenderCharacters()" class="bg-slate-900 border border-[#2A2F3A] rounded-2xl px-4 py-2 text-sm">
                    <option value="engagement">Sort by Engagements</option>
                    <option value="views">Sort by Views</option>
                    <option value="followers">Sort by Followers</option>
                    <option value="growth">Sort by MoM Growth</option>
                </select>
            </div>
            <div id="character-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6"></div>
        </div>

        <!-- Growth Chart -->
        <div class="glass rounded-2xl p-6 mb-10">
            <div class="flex justify-between items-center mb-4">
                <div class="section-header">MONTHLY GROWTH BY CHARACTER</div>
                <select id="growth-sort" onchange="renderGrowthChart()" class="bg-slate-900 border border-[#2A2F3A] rounded-xl px-4 py-2 text-sm">
                    <option value="growth">Sort by Growth %</option>
                    <option value="name">Sort by Name</option>
                </select>
            </div>
            <div id="growthChart"></div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-10">
            <div class="xl:col-span-7 glass rounded-2xl p-6">
                <div class="section-header mb-4">MONTHLY VIEWS TREND</div>
                <div id="viewsChart"></div>
            </div>
            <div class="xl:col-span-5 glass rounded-2xl p-6">
                <div class="section-header mb-4">TOTAL VIEWS BY CHARACTER</div>
                <div id="charPerformanceChart"></div>
            </div>
        </div>

        <!-- Monthly Table -->
        <div class="glass rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4">
                <div class="section-header">MONTHLY PERFORMANCE DATA</div>
                <select id="table-character-filter" onchange="renderMonthlyTable()" class="bg-slate-900 border border-[#2A2F3A] rounded-2xl px-4 py-2 text-sm">
                    <option value="all">All Characters</option>
                </select>
            </div>
            <div id="monthly-table" class="overflow-x-auto"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby0OKihbLgl9yRGk7qxfjPZgEChxh1jwfEPHeET_mARjFQfV3rWtB9nnxV-9BlI-OYB/exec";
        let currentCharacters = [];
        let viewsChart = null;
        let performanceChart = null;
        let growthChart = null;
        let currentModalCharacter = null;

        const avatarMap = {
            "Miranda Kiera": "miranda.png", "Ava Sinclair": "ava.png", "Kane Voss": "kane.png",
            "Chloe Mitchell": "chloe.png", "Melina Mayer": "melina.png", "Aussie Spirit": "Aussie.png"
        };

        async function loadData() {
            const status = document.getElementById('last-updated');
            try {
                status.innerHTML = `⏳ Loading...`;
                const res = await fetch(API_URL);
                const data = await res.json();
                currentCharacters = Object.values(data || {});
            } catch (e) {
                console.error(e);
                status.innerHTML = `⚠️ Demo mode`;
                currentCharacters = getDemoData();
            }
            initDashboard();
        }

        function getDemoData() {
            return [
                { name: "Miranda Kiera", months: ["Jan","Feb","Mar","Apr"], total_views: [800,900,1000,1100], total_followers: [200,210,220,230], total_engagements: [50000,55000,60000,65000] }
            ];
        }

        function initDashboard() {
            renderKPIs();
            renderCharacterCards(currentCharacters);
            renderCharts();
            renderGrowthChart();
            populateTableFilter();
            renderMonthlyTable();
            document.getElementById('last-updated').innerHTML = `✅ Live • Updated just now`;
        }

        // Calculate MoM Growth for last active month
        function calculateMoMGrowth(char) {
            const views = char.total_views;
            const engagements = char.total_engagements;

            // Find last active month (non-zero)
            let lastIndex = -1;
            for (let i = views.length - 1; i >= 0; i--) {
                if (views[i] > 0) {
                    lastIndex = i;
                    break;
                }
            }

            if (lastIndex <= 0) return 0; // Not enough data

            const prevEng = engagements[lastIndex - 1] || 0;
            const currEng = engagements[lastIndex] || 0;

            if (prevEng === 0) return 0;

            return ((currEng - prevEng) / prevEng) * 100;
        }

        function renderKPIs() {
            let tv = 0, tf = 0, te = 0;
            let totalGrowth = 0;
            let count = 0;

            currentCharacters.forEach(c => {
                tv += c.total_views.reduce((a,b)=>a+b,0);
                tf += Math.max(...c.total_followers);
                te += c.total_engagements.reduce((a,b)=>a+b,0);
                
                const growth = calculateMoMGrowth(c);
                if (!isNaN(growth)) {
                    totalGrowth += growth;
                    count++;
                }
            });

            const avgGrowth = count > 0 ? (totalGrowth / count).toFixed(1) : 0;

            document.getElementById('kpi-row').innerHTML = `
                <div class="glass rounded-2xl p-6"><div class="text-[#9CA3AF] text-sm mb-1">TOTAL VIEWS</div><div class="text-4xl font-semibold">${tv.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-6"><div class="text-[#9CA3AF] text-sm mb-1">TOTAL FOLLOWERS</div><div class="text-4xl font-semibold">${tf.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-6"><div class="text-[#9CA3AF] text-sm mb-1">TOTAL ENGAGEMENT</div><div class="text-4xl font-semibold">${te.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-6"><div class="text-[#9CA3AF] text-sm mb-1">AVG MoM GROWTH</div><div class="text-4xl font-semibold text-[#67E8F9]">${avgGrowth}<span class="text-2xl">%</span></div></div>
            `;
        }

        function renderCharacterCards(chars) {
            const container = document.getElementById('character-grid');
            container.innerHTML = '';

            chars.forEach(char => {
                const v = char.total_views.reduce((a,b)=>a+b,0);
                const e = char.total_engagements.reduce((a,b)=>a+b,0);
                const f = Math.max(...char.total_followers);
                const growth = calculateMoMGrowth(char);
                const avatar = avatarMap[char.name] || "logo.png";

                const card = document.createElement('div');
                card.className = `glass rounded-3xl p-6 character-card border border-[#2A2F3A] cursor-pointer`;
                card.innerHTML = `
                    <div class="flex items-center gap-4 mb-6">
                        <img src="${avatar}" class="w-12 h-12 rounded-2xl object-cover border border-[#2A2F3A] flex-shrink-0" alt="${char.name}">
                        <div class="font-semibold text-[17px] leading-tight">${char.name}</div>
                    </div>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between"><span class="text-[#9CA3AF]">Views</span> <span class="font-semibold">${v.toLocaleString()}</span></div>
                        <div class="flex justify-between"><span class="text-[#9CA3AF]">Followers</span> <span class="font-semibold">${f}</span></div>
                        <div class="flex justify-between"><span class="text-[#9CA3AF]">Engagements</span> <span class="font-semibold">${e.toLocaleString()}</span></div>
                        <div class="flex justify-between pt-1 border-t border-[#2A2F3A]">
                            <span class="text-[#9CA3AF]">MoM Growth</span> 
                            <span class="font-semibold ${growth >= 0 ? 'text-[#67E8F9]' : 'text-red-400'}">${growth.toFixed(1)}%</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openCharacterModal(char);
                container.appendChild(card);
            });
        }

        function sortAndRenderCharacters() {
            const type = document.getElementById('char-sort').value;
            let sorted = [...currentCharacters];

            if (type === 'engagement') sorted.sort((a,b) => b.total_engagements.reduce((x,y)=>x+y,0) - a.total_engagements.reduce((x,y)=>x+y,0));
            if (type === 'views') sorted.sort((a,b) => b.total_views.reduce((x,y)=>x+y,0) - a.total_views.reduce((x,y)=>x+y,0));
            if (type === 'followers') sorted.sort((a,b) => Math.max(...b.total_followers) - Math.max(...a.total_followers));
            if (type === 'growth') sorted.sort((a,b) => calculateMoMGrowth(b) - calculateMoMGrowth(a));

            renderCharacterCards(sorted);
        }

        function renderCharts() {
            if (viewsChart) viewsChart.destroy();
            if (performanceChart) performanceChart.destroy();

            viewsChart = new ApexCharts(document.querySelector("#viewsChart"), {
                chart: { type: 'line', height: 340, toolbar: { show: true } },
                series: currentCharacters.map(c => ({ name: c.name, data: c.total_views })),
                xaxis: { categories: currentCharacters[0]?.months || [] },
                stroke: { curve: 'smooth', width: 3.5 },
                colors: ['#67E8F9', '#9EEBFF', '#7DADCA', '#14b8a6', '#f59e0b'],
                tooltip: { theme: 'dark' }
            });
            viewsChart.render();

            const sorted = [...currentCharacters].sort((a,b) => b.total_views.reduce((x,y)=>x+y,0) - a.total_views.reduce((x,y)=>x+y,0));
            performanceChart = new ApexCharts(document.querySelector("#charPerformanceChart"), {
                chart: { type: 'bar', height: 340 },
                series: [{ name: 'Total Views', data: sorted.map(c => c.total_views.reduce((a,b)=>a+b,0)) }],
                xaxis: { categories: sorted.map(c => c.name) },
                colors: ['#67E8F9'],
                plotOptions: { bar: { borderRadius: 8 } }
            });
            performanceChart.render();
        }

        function renderGrowthChart() {
            if (growthChart) growthChart.destroy();

            const sortType = document.getElementById('growth-sort').value;
            let data = currentCharacters.map(c => ({
                name: c.name,
                growth: calculateMoMGrowth(c)
            }));

            if (sortType === 'growth') {
                data.sort((a,b) => b.growth - a.growth);
            } else {
                data.sort((a,b) => a.name.localeCompare(b.name));
            }

            growthChart = new ApexCharts(document.querySelector("#growthChart"), {
                chart: { type: 'bar', height: 320 },
                series: [{ name: 'MoM Growth %', data: data.map(d => d.growth) }],
                xaxis: { categories: data.map(d => d.name) },
                colors: ['#67E8F9'],
                plotOptions: { bar: { borderRadius: 6 } },
                tooltip: { theme: 'dark' }
            });
            growthChart.render();
        }

        function populateTableFilter() { /* ... */ }
        function renderMonthlyTable() { /* ... */ }

        function openCharacterModal(char) {
            currentModalCharacter = char;
            document.getElementById('character-modal').classList.remove('hidden');
            document.getElementById('modal-character-name').innerHTML = char.name;
            document.getElementById('modal-avatar').src = avatarMap[char.name] || "logo.png";

            renderModalOverview(char);
            switchModalTab(0);
        }

        function switchModalTab(tabIndex) {
            document.getElementById('modal-tab-0').classList.toggle('hidden', tabIndex !== 0);
            document.getElementById('modal-tab-1').classList.toggle('hidden', tabIndex !== 1);
            document.getElementById('tab-0').classList.toggle('active', tabIndex === 0);
            document.getElementById('tab-1').classList.toggle('active', tabIndex === 1);

            if (tabIndex === 1 && currentModalCharacter) {
                renderPlatformBreakdown(currentModalCharacter);
            }
        }

        function renderModalOverview(char) {
            const totalV = char.total_views.reduce((a,b)=>a+b,0);
            const totalE = char.total_engagements.reduce((a,b)=>a+b,0);
            const latestF = Math.max(...char.total_followers);
            const growth = calculateMoMGrowth(char);

            document.getElementById('modal-summary').innerHTML = `
                <div class="glass rounded-2xl p-5"><div class="text-[#9CA3AF] text-sm">Total Views</div><div class="text-3xl font-semibold">${totalV.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-5"><div class="text-[#9CA3AF] text-sm">Total Followers</div><div class="text-3xl font-semibold">${latestF}</div></div>
                <div class="glass rounded-2xl p-5"><div class="text-[#9CA3AF] text-sm">Total Engagements</div><div class="text-3xl font-semibold">${totalE.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-5"><div class="text-[#9CA3AF] text-sm">MoM Growth</div><div class="text-3xl font-semibold text-[#67E8F9]">${growth.toFixed(1)}%</div></div>
            `;

            renderModalMonthlyTable(char);
        }

        function renderModalMonthlyTable(char) {
            const container = document.getElementById('modal-monthly-table');
            let html = `<table class="w-full text-sm"><thead><tr class="border-b border-[#2A2F3A] text-[#9CA3AF]">
                <th class="text-left py-3">Month</th><th class="text-right py-3">Views</th>
                <th class="text-right py-3">Followers</th><th class="text-right py-3">Engagements</th><th class="text-right py-3">Rate</th></tr></thead><tbody>`;

            char.months.forEach((m, i) => {
                const v = char.total_views[i]||0, f = char.total_followers[i]||0, e = char.total_engagements[i]||0;
                const rate = v > 0 ? ((e/v)*100).toFixed(1) : '0';
                html += `<tr class="border-b border-[#2A2F3A]"><td class="py-3">${m}</td>
                    <td class="text-right">${v}</td><td class="text-right">${f}</td>
                    <td class="text-right">${e}</td><td class="text-right text-[#67E8F9]">${rate}%</td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function sortModalMonthlyTable() {
            if (!currentModalCharacter) return;
            // Sorting logic can be added here if needed
        }

        function renderPlatformBreakdown(char) {
            // Same as previous
        }

        function closeModal() {
            document.getElementById('character-modal').classList.add('hidden');
        }

        window.onload = loadData;
    </script>
</body>
</html>
