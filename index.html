<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARROWOW • Analytics</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; background: #050505; color: #e5e7eb; }
        .glass { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.12); }
        .section-header { font-size: 1rem; font-weight: 600; color: #94a3b8; letter-spacing: -.015em; }
        .character-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .character-card:hover { transform: translateY(-6px); border-color: #67e8f9; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div class="max-w-screen-2xl mx-auto px-8 pt-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-x-4">
                <!-- Logo -->
                <img src="logo.png" alt="Arrowow Logo" class="w-11 h-11 object-contain">
                <div>
                    <h1 class="text-4xl font-semibold tracking-tight">ARROWOW</h1>
                    <p class="text-[#67e8f9] text-sm -mt-1 tracking-wide">ANALYTICS</p>
                </div>
            </div>
            <div id="last-updated" class="text-emerald-400 text-sm font-medium"></div>
        </div>

        <!-- KPIs -->
        <div class="mb-10">
            <div class="section-header mb-4">OVERVIEW</div>
            <div id="kpi-row" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>
        </div>

        <!-- Characters -->
        <div class="mb-10">
            <div class="flex justify-between items-center mb-4">
                <div class="section-header">CHARACTERS</div>
                <select id="char-sort" onchange="sortAndRenderCharacters()" class="bg-slate-900 border border-slate-700 rounded-2xl px-4 py-2 text-sm">
                    <option value="engagement">Sort by Engagements</option>
                    <option value="views">Sort by Views</option>
                    <option value="followers">Sort by Followers</option>
                    <option value="rate">Sort by Eng. Rate</option>
                </select>
            </div>
            <div id="character-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6"></div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-10">
            <div class="xl:col-span-7 glass rounded-2xl p-6">
                <div class="section-header mb-4">MONTHLY VIEWS TREND</div>
                <div id="viewsChart"></div>
            </div>
            <div class="xl:col-span-5 glass rounded-2xl p-6">
                <div class="section-header mb-4">TOTAL VIEWS BY CHARACTER</div>
                <div id="charPerformanceChart"></div>
            </div>
        </div>

        <!-- Monthly Table -->
        <div class="glass rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4">
                <div class="section-header">MONTHLY PERFORMANCE DATA</div>
                <select id="table-character-filter" onchange="renderMonthlyTable()" class="bg-slate-900 border border-slate-700 rounded-2xl px-4 py-2 text-sm">
                    <option value="all">All Characters</option>
                </select>
            </div>
            <div id="monthly-table" class="overflow-x-auto"></div>
        </div>
    </div>

    <!-- Character Modal -->
    <div id="character-modal" onclick="if (event.target.id === 'character-modal') closeModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" class="glass rounded-2xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-hidden">
            <div class="flex justify-between items-center px-8 py-5 border-b border-slate-700">
                <div id="modal-character-name" class="text-2xl font-semibold"></div>
                <button onclick="closeModal()" class="text-3xl text-slate-400 hover:text-white">&times;</button>
            </div>
            <div class="p-8 overflow-y-auto max-h-[75vh]">
                <div id="modal-summary" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <div class="font-semibold">Monthly Breakdown</div>
                        <select id="modal-sort" onchange="sortModalTable()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-sm">
                            <option value="month">Sort by Month</option>
                            <option value="views">Sort by Views</option>
                            <option value="followers">Sort by Followers</option>
                            <option value="engagements">Sort by Engagements</option>
                        </select>
                    </div>
                    <div id="modal-monthly-table" class="overflow-x-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby0OKihbLgl9yRGk7qxfjPZgEChxh1jwfEPHeET_mARjFQfV3rWtB9nnxV-9BlI-OYB/exec";
        let currentCharacters = [];
        let viewsChart = null;
        let performanceChart = null;
        let currentModalCharacter = null;

        const avatarMap = {
            "Miranda Kiera": "miranda.png",
            "Ava Sinclair": "ava.png",
            "Kane Voss": "kane.png",
            "Chloe Mitchell": "chloe.png",
            "Melina Mayer": "melina.png",
            "Aussie Spirit": "Aussie.png"
        };

        async function loadData() {
            const status = document.getElementById('last-updated');
            try {
                status.innerHTML = `⏳ Loading...`;
                const res = await fetch(API_URL);
                const data = await res.json();
                currentCharacters = Object.values(data || {});
            } catch (e) {
                console.error(e);
                status.innerHTML = `⚠️ Demo mode`;
                currentCharacters = getDemoData();
            }
            initDashboard();
        }

        function getDemoData() {
            return [
                { name: "Miranda Kiera", months: ["Jan","Feb","Mar","Apr"], total_views: [800,800,800,800], total_followers: [200,200,200,200], total_engagements: [60834,60834,60834,60834] }
            ];
        }

        function initDashboard() {
            renderKPIs();
            renderCharacterCards(currentCharacters);
            renderCharts();
            populateTableFilter();
            renderMonthlyTable();
            document.getElementById('last-updated').innerHTML = `✅ Live • Updated just now`;
        }

        function renderKPIs() {
            let tv = 0, tf = 0, te = 0;
            currentCharacters.forEach(c => {
                tv += c.total_views.reduce((a,b)=>a+b,0);
                tf += Math.max(...c.total_followers);
                te += c.total_engagements.reduce((a,b)=>a+b,0);
            });
            const rate = tv > 0 ? ((te / tv) * 100).toFixed(1) : 0;

            document.getElementById('kpi-row').innerHTML = `
                <div class="glass rounded-2xl p-6"><div class="text-slate-400 text-sm mb-1">TOTAL VIEWS</div><div class="text-4xl font-semibold">${tv.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-6"><div class="text-slate-400 text-sm mb-1">TOTAL FOLLOWERS</div><div class="text-4xl font-semibold">${tf.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-6"><div class="text-slate-400 text-sm mb-1">TOTAL ENGAGEMENT</div><div class="text-4xl font-semibold">${te.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-6"><div class="text-slate-400 text-sm mb-1">AVG ENG. RATE</div><div class="text-4xl font-semibold">${rate}<span class="text-2xl">%</span></div></div>
            `;
        }

        function renderCharacterCards(chars) {
            const container = document.getElementById('character-grid');
            container.innerHTML = '';

            chars.forEach(char => {
                const v = char.total_views.reduce((a,b)=>a+b,0);
                const e = char.total_engagements.reduce((a,b)=>a+b,0);
                const f = Math.max(...char.total_followers);
                const rate = v > 0 ? ((e/v)*100).toFixed(1) : 0;
                const avatar = avatarMap[char.name] || "logo.png";

                const card = document.createElement('div');
                card.className = `glass rounded-3xl p-6 character-card border border-transparent cursor-pointer`;
                card.innerHTML = `
                    <div class="flex items-center gap-4 mb-6">
                        <img src="${avatar}" class="w-12 h-12 rounded-2xl object-cover border border-slate-700 flex-shrink-0" alt="${char.name}">
                        <div class="font-semibold text-[17px] leading-tight">${char.name}</div>
                    </div>

                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400">Views</span>
                            <span class="font-semibold">${v.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400">Followers</span>
                            <span class="font-semibold">${f}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400">Engagements</span>
                            <span class="font-semibold">${e.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between items-center pt-1 border-t border-slate-700">
                            <span class="text-slate-400">Eng. Rate</span>
                            <span class="font-semibold text-emerald-400">${rate}%</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openCharacterModal(char);
                container.appendChild(card);
            });
        }

        function sortAndRenderCharacters() {
            const type = document.getElementById('char-sort').value;
            let sorted = [...currentCharacters];

            if (type === 'engagement') sorted.sort((a,b) => b.total_engagements.reduce((x,y)=>x+y,0) - a.total_engagements.reduce((x,y)=>x+y,0));
            if (type === 'views') sorted.sort((a,b) => b.total_views.reduce((x,y)=>x+y,0) - a.total_views.reduce((x,y)=>x+y,0));
            if (type === 'followers') sorted.sort((a,b) => Math.max(...b.total_followers) - Math.max(...a.total_followers));
            if (type === 'rate') sorted.sort((a,b) => {
                const ra = a.total_views.reduce((x,y)=>x+y,0) > 0 ? a.total_engagements.reduce((x,y)=>x+y,0) / a.total_views.reduce((x,y)=>x+y,0) : 0;
                const rb = b.total_views.reduce((x,y)=>x+y,0) > 0 ? b.total_engagements.reduce((x,y)=>x+y,0) / b.total_views.reduce((x,y)=>x+y,0) : 0;
                return rb - ra;
            });
            renderCharacterCards(sorted);
        }

        function renderCharts() {
            if (viewsChart) viewsChart.destroy();
            if (performanceChart) performanceChart.destroy();

            // Monthly Views Trend
            const sortedTrend = [...currentCharacters];
            viewsChart = new ApexCharts(document.querySelector("#viewsChart"), {
                chart: { type: 'line', height: 340, toolbar: { show: true }, animations: { enabled: true } },
                series: sortedTrend.map(c => ({ name: c.name, data: c.total_views })),
                xaxis: { categories: currentCharacters[0]?.months || [] },
                stroke: { curve: 'smooth', width: 3.5 },
                colors: ['#67e8f9', '#a855f7', '#14b8a6', '#f59e0b', '#ec4899'],
                markers: { size: 4 },
                tooltip: { theme: 'dark' },
                legend: { position: 'top' }
            });
            viewsChart.render();

            // Bar Chart
            const sortedBar = [...currentCharacters].sort((a,b) => b.total_views.reduce((x,y)=>x+y,0) - a.total_views.reduce((x,y)=>x+y,0));
            performanceChart = new ApexCharts(document.querySelector("#charPerformanceChart"), {
                chart: { type: 'bar', height: 340, toolbar: { show: false } },
                series: [{ name: 'Total Views', data: sortedBar.map(c => c.total_views.reduce((a,b)=>a+b,0)) }],
                xaxis: { categories: sortedBar.map(c => c.name) },
                colors: ['#67e8f9'],
                plotOptions: { bar: { borderRadius: 8, columnWidth: '55%' } },
                tooltip: { theme: 'dark' }
            });
            performanceChart.render();
        }

        function populateTableFilter() {
            const sel = document.getElementById('table-character-filter');
            sel.innerHTML = '<option value="all">All Characters</option>';
            currentCharacters.forEach(c => {
                const o = document.createElement('option'); o.value = c.name; o.textContent = c.name;
                sel.appendChild(o);
            });
        }

        function renderMonthlyTable() {
            const container = document.getElementById('monthly-table');
            const filter = document.getElementById('table-character-filter').value;
            let html = `<table class="w-full text-sm"><thead><tr class="border-b border-slate-700 text-slate-400">
                <th class="text-left py-4">Character</th><th class="text-left py-4">Month</th>
                <th class="text-right py-4">Views</th><th class="text-right py-4">Followers</th>
                <th class="text-right py-4">Engagements</th><th class="text-right py-4">Rate</th></tr></thead><tbody>`;

            currentCharacters.forEach(char => {
                if (filter !== 'all' && filter !== char.name) return;
                char.months.forEach((m, i) => {
                    const v = char.total_views[i]||0, f = char.total_followers[i]||0, e = char.total_engagements[i]||0;
                    const rate = v > 0 ? ((e/v)*100).toFixed(1) : '0';
                    html += `<tr class="border-b border-slate-800"><td class="py-4 font-medium">${char.name}</td><td>${m}</td>
                        <td class="text-right">${v}</td><td class="text-right">${f}</td><td class="text-right">${e}</td>
                        <td class="text-right text-emerald-400">${rate}%</td></tr>`;
                });
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function openCharacterModal(char) {
            currentModalCharacter = char;
            document.getElementById('character-modal').classList.remove('hidden');
            document.getElementById('modal-character-name').innerHTML = char.name;

            const totalV = char.total_views.reduce((a,b)=>a+b,0);
            const totalE = char.total_engagements.reduce((a,b)=>a+b,0);
            const latestF = Math.max(...char.total_followers);
            const rate = totalV > 0 ? ((totalE/totalV)*100).toFixed(1) : 0;

            document.getElementById('modal-summary').innerHTML = `
                <div class="glass rounded-2xl p-5"><div class="text-sm text-slate-400">Total Views</div><div class="text-3xl font-semibold">${totalV.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-5"><div class="text-sm text-slate-400">Total Followers</div><div class="text-3xl font-semibold">${latestF}</div></div>
                <div class="glass rounded-2xl p-5"><div class="text-sm text-slate-400">Total Engagements</div><div class="text-3xl font-semibold">${totalE.toLocaleString()}</div></div>
                <div class="glass rounded-2xl p-5"><div class="text-sm text-slate-400">Engagement Rate</div><div class="text-3xl font-semibold">${rate}%</div></div>
            `;
            renderModalMonthlyTable(char);
        }

        function renderModalMonthlyTable(char) {
            const container = document.getElementById('modal-monthly-table');
            let html = `<table class="w-full text-sm"><thead><tr class="border-b border-slate-700 text-slate-400">
                <th class="text-left py-3">Month</th><th class="text-right py-3">Views</th>
                <th class="text-right py-3">Followers</th><th class="text-right py-3">Engagements</th><th class="text-right py-3">Rate</th></tr></thead><tbody>`;

            char.months.forEach((m, i) => {
                const v = char.total_views[i]||0, f = char.total_followers[i]||0, e = char.total_engagements[i]||0;
                const rate = v > 0 ? ((e/v)*100).toFixed(1) : '0';
                html += `<tr class="border-b border-slate-800"><td class="py-3">${m}</td>
                    <td class="text-right">${v}</td><td class="text-right">${f}</td>
                    <td class="text-right">${e}</td><td class="text-right text-emerald-400">${rate}%</td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function sortModalTable() {
            if (!currentModalCharacter) return;
            renderModalMonthlyTable(currentModalCharacter);
        }

        function closeModal() {
            document.getElementById('character-modal').classList.add('hidden');
        }

        window.onload = loadData;
    </script>
</body>
</html>
